[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuhcoverage"
version = "0.1.0"
description = "Batch coverage analysis for Wazuh JSON archives using DuckDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
wazuhcoverage = "wazuhcoverage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
