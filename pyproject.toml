[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuhcoverage"
version = "0.3.0"
description = "Analyze coverage in Wazuh JSON archives using DuckDB"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "Zafer Balkan", email = "zafer@zaferbalkan.com" },
]
keywords = ["wazuh", "siem", "coverage", "duckdb", "detection", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  # DuckDB dropped Python 3.9 in 1.5.0. Resolvers already honour that via
  # Requires-Python, but the cap is stated explicitly so a 3.9 install can
  # never silently acquire a DuckDB the package has not been tested against.
  "duckdb>=1.3,<2; python_version >= '3.10'",
  "duckdb>=1.3,<1.5; python_version < '3.10'",
  # Drain template mining is the grouping engine, not an option, so drain3 is
  # a runtime dependency. It is pure Python and sets no interpreter floor, but
  # it does pin its own dependencies exactly (jsonpickle and cachetools), which
  # the dependency-conflict CI job exists to catch when that pin starts to
  # collide with something else in a resolved environment.
  "drain3>=0.9.11,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]
build = [
  "build>=1.2",
  "twine>=5",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
wazuhcoverage = "wazuhcoverage.cli:main"

[project.urls]
Homepage = "https://github.com/zbalkan/wazuhcoverage"
Repository = "https://github.com/zbalkan/wazuhcoverage"
Issues = "https://github.com/zbalkan/wazuhcoverage/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wazuhcoverage = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# UP007/UP045 would rewrite the public annotations back to PEP 604 unions.
# That syntax is only safe on 3.9 while the annotation stays an unevaluated
# string, and these models are part of a py.typed API whose annotations
# consumers resolve with typing.get_type_hints() -- which evaluates them and
# raises TypeError on 3.9. Drop this ignore when the floor moves to 3.10.
ignore = ["UP007", "UP045"]
