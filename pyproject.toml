[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuhcoverage"
# Read from wazuhcoverage.__version__ so the number the CLI prints and the
# number the distribution carries cannot drift apart.
dynamic = ["version"]
description = "Analyze coverage in Wazuh JSON archives using DuckDB"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Zafer Balkan", email = "zafer@zaferbalkan.com" },
]
keywords = ["wazuh", "siem", "coverage", "duckdb", "detection", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "duckdb>=1.3,<2",
  # Drain template mining is the grouping engine, not an option, so drain3 is
  # a runtime dependency. It is pure Python and sets no interpreter floor, but
  # it does pin its own dependencies exactly (jsonpickle and cachetools), which
  # the dependency-conflict CI job exists to catch when that pin starts to
  # collide with something else in a resolved environment.
  "drain3>=0.9.11,<1",
  # Replay is part of the normal coverage workflow. The project is Linux-only,
  # matching wazuhtester and the local wazuh-logtest Unix-socket interface.
  "wazuhtester>=0.1.0rc1,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]
build = [
  "build>=1.2",
  "twine>=5",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
wazuhcoverage = "wazuhcoverage.cli:main"

[project.urls]
Homepage = "https://github.com/zbalkan/wazuhcoverage"
Repository = "https://github.com/zbalkan/wazuhcoverage"
Issues = "https://github.com/zbalkan/wazuhcoverage/issues"

[tool.setuptools.dynamic]
version = { attr = "wazuhcoverage.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wazuhcoverage = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 120


[tool.ruff.lint]
# Keep the existing annotation/import style; the Linux-only packaging change
# does not require a repository-wide typing modernization.
ignore = ["UP007", "UP035", "UP045"]
