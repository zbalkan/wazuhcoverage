name: CI

on:
  push:
    # Keep documentation-only edits from spending the full test matrix, while
    # still testing changes to non-Markdown assets and every other file type.
    paths-ignore: &markdown-only
      - "**/*.md"
  pull_request:
    paths-ignore: *markdown-only

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # macos-latest is arm64-only, and actions/setup-python ships no
          # macOS arm64 build for any 3.9 patch newer than 3.9.13. Linux and
          # Windows cover the 3.9 floor; the POSIX paths are shared with macOS.
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      # An install whose resolved set is internally inconsistent produces test
      # failures that look like code defects, so the environment is checked
      # before anything runs in it.
      - run: python -m pip check
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests tools

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine pipx
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: python -c "from wazuhcoverage import ArchiveAnalysis, Finding, analyze_archive; assert callable(analyze_archive)"
      - run: python -c "from importlib.resources import files; assert files('wazuhcoverage').joinpath('py.typed').is_file()"
      - run: pipx install dist/*.whl
      - run: wazuhcoverage --help
      - run: python -m wazuhcoverage --help

  dependencies:
    # drain3 is a runtime dependency and pins two libraries to exact versions,
    # so this package constrains every environment it is installed into. These
    # checks exist to notice when that constraint surface changes or stops
    # resolving, rather than finding out from an install failure downstream.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      # Resolve the declared requirements from scratch, without consulting what
      # is already installed. This fails on an unsatisfiable graph -- a pinned
      # transitive with no release for this interpreter, for instance -- which
      # an editable install into a warm environment can hide.
      - name: Requirements resolve on this interpreter
        run: python -m pip install --dry-run --ignore-installed --report /dev/null .
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      # Report every exact pin the dependency tree imposes, and fail when one
      # appears or disappears without the note in tools/check_dependency_pins.py
      # being updated to match.
      - run: python tools/check_dependency_pins.py
