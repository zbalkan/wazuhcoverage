name: CI

on:
  push:
    branches:
      - main
      - master
      - "roadmap/**"
    paths-ignore: &documentation-only
      - "**/*.md"
      - "**/*.avif"
      - "**/*.bmp"
      - "**/*.gif"
      - "**/*.ico"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.png"
      - "**/*.svg"
      - "**/*.tif"
      - "**/*.tiff"
      - "**/*.webp"
  pull_request:
    paths-ignore: *documentation-only

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine pipx
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: python -c "from wazuhcoverage import ArchiveAnalysis, Finding, analyze_archive; assert callable(analyze_archive)"
      - run: pipx install dist/*.whl
      - run: wazuhcoverage --help
      - run: python -m wazuhcoverage --help
