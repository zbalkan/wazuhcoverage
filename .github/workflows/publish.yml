name: Build and publish release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Require master branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "Publishing must be triggered from master."
            exit 1
          fi

      - name: Read package version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate version tag state
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          CURRENT_SHA=$(git rev-parse HEAD)
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$CURRENT_SHA" ]; then
              echo "$TAG already points to $TAG_SHA, not $CURRENT_SHA."
              exit 1
            fi
          fi

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      # A release must not ship a dependency constraint nobody reviewed.
      - run: python tools/check_dependency_pins.py
      - run: python -m pytest
      - run: python -m ruff check src tests tools
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "from wazuhcoverage import ArchiveAnalysis, Finding, analyze_archive; assert callable(analyze_archive)"
      - run: python -m pip install --upgrade pipx
      - run: pipx install dist/*.whl
      - run: wazuhcoverage --help
      - run: python -m wazuhcoverage --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Create version tag after publication
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )
          TAG="v$VERSION"
          CURRENT_SHA=$(git rev-parse HEAD)
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "$TAG")
            if [ "$TAG_SHA" != "$CURRENT_SHA" ]; then
              echo "$TAG already points to $TAG_SHA, not $CURRENT_SHA."
              exit 1
            fi
            echo "$TAG already points to this commit; continuing."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
